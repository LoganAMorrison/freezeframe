[package]
name = "freezeframe"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Dark-matter freeze-out beyond kinetic equilibrium: the full phase-space Boltzmann equation, the coupled (Y, y) moment equations and the standard number-density equation"
license = "MIT OR Apache-2.0"
keywords = ["dark-matter", "boltzmann", "relic-density", "cosmology", "physics"]
categories = ["science", "mathematics"]
readme = "README.md"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 3
